name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission and Normalize Line Endings for Gradlew
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Run Android Lint
        working-directory: android
        env:
          JAVA_TOOL_OPTIONS: ""
          _JAVA_OPTIONS: ""
          GRADLE_OPTS: ""
        run: ./gradlew lint

      - name: Assemble Debug APK
        working-directory: android
        env:
          JAVA_TOOL_OPTIONS: ""
          _JAVA_OPTIONS: ""
          GRADLE_OPTS: ""
        run: ./gradlew assembleDebug
