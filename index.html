
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="var(--app-primary)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vizu" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>VIZU Proximity Social</title>
    <meta name="description" content="Proximity-based social discovery app. Experience the Flow, catch the Zaps, stay for the Hush, and discover new Personas using AR and GPS." />
    <meta property="og:title" content="VIZU Proximity Social" />
    <meta property="og:description" content="Proximity-based social discovery app. Experience the Flow, catch the Zaps, stay for the Hush, and discover new Personas using AR and GPS." />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Lexend', sans-serif;
        background: var(--app-bg);
        min-height: 100vh;
        color: var(--text-primary);
        overflow: hidden;
        touch-action: manipulation;
      }
      #root {
        height: 100vh;
      }
      .font-montserrat { font-family: 'Montserrat', sans-serif; }
      .glass {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .safe-area-inset {
        padding-top: var(--sat);
        padding-bottom: var(--sab);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      /* Android-style scrollbar hiding */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
